<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 64 64" fill="none">
  <title>Black and white coffee bean cursor</title>
  <desc>A white arrow cursor with a black outline and black coffee bean symbol.</desc>

  <!-- Cursor body; the top-left tip is the intended hotspot. -->
  <path
    d="M4 3L57 35L36.5 39.2L48.2 57.3L37.2 63L25.7 44.6L12.4 59L4 3Z"
    fill="#FFFFFF"
    stroke="#000000"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Coffee bean. -->
  <g transform="rotate(-28 26.5 30.5)">
    <path
      d="M18.2 21.1C23.1 16.2 31.5 17 35 22.8C38.7 29 34.4 38.7 27.1 40.1C19.9 41.4 13.8 34.5 14.8 27.4C15.2 24.9 16.4 22.8 18.2 21.1Z"
      fill="#000000"
    />
    <path
      d="M20.2 20.5C18.9 25.5 21.2 29.1 25.5 31.6C29.4 33.9 31.3 36.1 31.3 39"
      stroke="#FFFFFF"
      stroke-width="3.2"
      stroke-linecap="round"
    />
  </g>
</svg>
